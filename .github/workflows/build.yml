name: Build StockNote apps
on:
  workflow_dispatch:
  push:
    branches:
      - main
    tags:
      - "v*"
permissions:
  contents: read
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            label: Windows
          - os: macos-15
            label: Mac
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install packages
        run: python -m pip install -r requirements-build.txt
      - name: Validate Python
        run: python -m py_compile build_app.py 재고노트_통합API_로컬서버.py
      - name: Package app
        run: python build_app.py
      - uses: actions/upload-artifact@v4
        with:
          name: StockNote-${{ matrix.label }}
          path: release/*.zip
          if-no-files-found: error
  publish:
    if: startsWith(github.ref, 'refs/tags/v') || github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: StockNote-*
          path: release
          merge-multiple: true
      - name: Verify packages
        run: test -s release/StockNote_Windows.zip && test -s release/StockNote_Mac.zip
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || 'v7.3.0-preview' }}
          name: StockNote v7.3.0 preview
          body: |
            Windows 및 Mac 독립형 재고관리 앱의 미리보기 배포입니다.
            옵션별 상품 관리, 입출고, CSV 주문 불러오기 및 API 연결 화면을 테스트할 수 있습니다.
            스마트스토어와 POIZON 공식 API 주문 조회를 구현했으나 실계정 권한 확인이 필요합니다. KREAM은 승인된 자체 API 주소와 인증 명세가 없으면 자동 조회가 불가능합니다.
            서명/공증이 없는 테스트용 앱이므로 운영체제 보안 경고가 표시될 수 있습니다.
            실제 재고 사용 전 반드시 백업하세요.
          files: release/*.zip
          fail_on_unmatched_files: true
          generate_release_notes: true